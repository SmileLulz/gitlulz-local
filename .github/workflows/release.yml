name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: read
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$version" ]; then
            echo "VERSION file is empty or missing" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  cross:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: ./build-on-linux.sh cross
      - uses: actions/upload-artifact@v7
        with:
          name: cross-binaries
          path: dist/

  package-arch-x86_64:
    needs: version
    runs-on: ubuntu-24.04
    container: archlinux/archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git go sudo

      - name: Create non-root builder
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R builder:builder .

      - uses: actions/checkout@v6
        with:
          path: src

      - name: Build package
        run: |
          chown -R builder:builder src
          su builder -c 'cd src/packaging/archlinux-local && PKGEXT=.pkg.tar.zst makepkg -s --noconfirm'

      - name: Normalize package filename
        run: |
          mkdir -p dist
          pkg="$(find src/packaging/archlinux-local -maxdepth 1 -name '*.pkg.tar.*' ! -name '*-debug-*' -print -quit)"
          if [ -z "$pkg" ]; then
            echo "no non-debug package found in src/packaging/archlinux-local" >&2
            find src/packaging/archlinux-local -maxdepth 1 -type f -ls >&2
            exit 1
          fi
          mv "$pkg" "dist/gitlulz-local-x86_64.pkg.tar.zst"

      - uses: actions/upload-artifact@v7
        with:
          name: archlinux-x86_64
          path: dist/gitlulz-local-x86_64.pkg.tar.zst

  package-arch-aarch64:
    needs: version
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Build package
        run: |
          mkdir -p dist
          docker run --rm \
            --platform linux/arm64 \
            -v "$PWD":/build \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            menci/archlinuxarm:base-devel \
            bash -c '
              set -e

              # Disable pacman sandbox syscalls that containers may not grant
              sed -i -e "s/^#DisableSandboxSyscalls/DisableSandboxSyscalls/" \
                     -e "s/^#DisableSandboxFilesystem/DisableSandboxFilesystem/" \
                     /etc/pacman.conf

              pacman -Syu --noconfirm --needed
              pacman -S --noconfirm --needed git go sudo

              # Create builder group/user matching the host UID/GID
              groupadd -g "$HOST_GID" builder 2>/dev/null || true
              useradd -m -u "$HOST_UID" -g builder builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

              # Give the builder user full access to the workspace
              chown -R builder:builder /build
              chmod -R a+w /build

              # Force a consistent package extension regardless of image default
              su builder -c "
                cd /build/packaging/archlinux-local
                PKGEXT=.pkg.tar.zst makepkg -s --noconfirm 2>&1 | tee /tmp/makepkg.log
              " || {
                echo "=== makepkg failed; full log follows ===" >&2
                cat /tmp/makepkg.log >&2
                exit 1
              }

              # Show what was produced (for debugging)
              echo "=== files after makepkg ===" >&2
              find /build/packaging/archlinux-local -maxdepth 1 -name "*.pkg.tar.*" -ls >&2
            '

      - name: Reclaim workspace ownership
        run: sudo chown -R "$(id -u):$(id -g)" .

      - name: Normalize package filename
        run: |
          mkdir -p dist
          pkg="$(find packaging/archlinux-local -maxdepth 1 -name '*.pkg.tar.*' ! -name '*-debug-*' -print -quit)"
          if [ -z "$pkg" ]; then
            echo "no non-debug package found in packaging/archlinux-local" >&2
            find packaging/archlinux-local -maxdepth 1 -type f -ls >&2
            exit 1
          fi
          mv "$pkg" "dist/gitlulz-local-aarch64.pkg.tar.zst"

      - uses: actions/upload-artifact@v7
        with:
          name: archlinux-aarch64
          path: dist/gitlulz-local-aarch64.pkg.tar.zst

  release:
    needs: [version, cross, package-arch-x86_64, package-arch-aarch64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/*
