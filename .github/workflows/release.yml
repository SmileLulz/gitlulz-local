name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: read
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$version" ]; then
            echo "VERSION file is empty or missing" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  cross:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: ./build-on-linux.sh cross
      - uses: actions/upload-artifact@v7
        with:
          name: cross-binaries
          path: dist/

  package-arch-x86_64:
    needs: version
    runs-on: ubuntu-24.04
    container: archlinux/archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git go sudo

      - name: Create non-root builder
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R builder:builder .

      - uses: actions/checkout@v6
        with:
          path: src

      - name: Build package
        run: |
          chown -R builder:builder src
          su builder -c 'cd src/packaging/archlinux-local && makepkg -s --noconfirm'

      - name: Normalize package filename
        run: |
          mkdir -p dist
          mv src/packaging/archlinux-local/*.pkg.tar.zst "dist/gitlulz-local-x86_64.pkg.tar.zst"

      - uses: actions/upload-artifact@v7
        with:
          name: archlinux-x86_64
          path: dist/gitlulz-local-x86_64.pkg.tar.zst

  package-arch-aarch64:
    needs: version
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Build package in native Arch Linux ARM container
        run: |
          docker run --rm \
            --platform linux/arm64 \
            -v "$PWD":/build \
            menci/archlinuxarm:base-devel \
            bash -c '
              set -e
              pacman -Syu --noconfirm --disable-sandbox
              pacman -S --noconfirm --disable-sandbox git go sudo
              useradd -m builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
              chown -R builder:builder /build
              su builder -c "cd /build/packaging/archlinux-local && makepkg -s --noconfirm"
            '

      - name: Reclaim workspace ownership
        run: sudo chown -R "$(id -u):$(id -g)" .

      - name: Normalize package filename
        run: |
          mkdir -p dist
          pkg="$(find packaging/archlinux-local -maxdepth 1 -name '*.pkg.tar.zst' ! -name '*-debug-*' -print -quit)"
          if [ -z "$pkg" ]; then
            echo "no non-debug package found in packaging/archlinux-local" >&2
            exit 1
          fi
          mv "$pkg" "dist/gitlulz-local-aarch64.pkg.tar.zst"

      - uses: actions/upload-artifact@v7
        with:
          name: archlinux-aarch64
          path: dist/gitlulz-local-aarch64.pkg.tar.zst

  release:
    needs: [version, cross, package-arch-x86_64, package-arch-aarch64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/*
