name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Read VERSION once and expose it to every downstream job
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$version" ]; then
            echo "VERSION file is empty or missing" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Cross-compiled binaries (raw executables, not packages)
  cross:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./build.sh cross
      - uses: actions/upload-artifact@v7
        with:
          name: cross-binaries
          path: dist/

  # Arch Linux x86_64 package, built natively in an Arch container
  package-arch-x86_64:
    needs: version
    runs-on: ubuntu-latest
    container: archlinux/archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git go sudo

      - name: Create non-root builder
        # makepkg refuses to run as root.
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R builder:builder .

      - uses: actions/checkout@v7
        with:
          path: src

      - name: Build package
        run: |
          chown -R builder:builder src
          su builder -c 'cd src/packaging/archlinux-local && makepkg -s --noconfirm'

      - uses: actions/upload-artifact@v7
        with:
          name: archlinux-x86_64
          path: src/packaging/archlinux-local/*.pkg.tar.zst

  # Arch Linux aarch64 package, built under QEMU emulation
  package-arch-aarch64:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU for aarch64
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: actions/checkout@v7

      - name: Build package in Arch Linux ARM container
        # stephank/archlinux:aarch64-makepkg contains QEMU static binaries
        # and an environment set up for makepkg.
        # The container runs as root, so it still creates a non-root builder.
        run: |
          docker run --rm \
            --platform linux/arm64 \
            -v "$PWD":/build \
            stephank/archlinux:aarch64-makepkg \
            bash -c '
              set -e
              pacman -Syu --noconfirm
              pacman -S --noconfirm git go sudo
              useradd -m builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
              chown -R builder:builder /build
              su builder -c "cd /build/packaging/archlinux-local && makepkg -s --noconfirm"
            '

      - uses: actions/upload-artifact@v7
        with:
          name: archlinux-aarch64
          path: packaging/archlinux-local/*.pkg.tar.zst

  # Create the GitHub Release and attach every artifact
  release:
    needs: [version, cross, package-arch-x86_64, package-arch-aarch64]
    runs-on: ubuntu-latest
    permissions:
      contents: write # required by softprops/action-gh-release
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/*
